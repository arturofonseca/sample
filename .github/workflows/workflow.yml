name: Test Suite

on: [push]

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          activate-environment: true

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Tests
        run: pytest
